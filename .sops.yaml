# Sops configuration by lPhiNix
#
# Recipients for each encrypted secrets file. A recipient is a *public* age
# key; sops seals a copy of the data key to each. Admins (YubiKeys) can open
# and edit everything; each host can only decrypt its own secrets.yaml.
# '&name' defines an anchor, '*name' reuses it.
#
keys:
    - &phix001 age1yubikey1q0jeyawc7seaj0nywe5def4hmjdhadk8nd8sft7zzg3zu9qz4xgqkhym9lh # admin: kypr001 (PIV)
    - &phix002 age1yubikey1q24ckzd3mfmrdtkl4ryhmt4p4wh3v6ec4juhmfucac2x4x3k48r2wt85603 # admin: kypr002 (PIV)
    - &noir age1h0ws5v79hyyu6d8lwple4skeqc0nxx7g4m23mjssyprvxzm6mf2qj2pjs4 # host: noir age key (bootstrap/noir)
    - &blizz age150f9ejqpr3q2sqpkxjs0pwcgacd00mt28rp4l69k05qgdug2ms6sehs34v # host: blizz age key (bootstrap/blizz)

# Each host file is encrypted to both admins and that host only.
creation_rules:
    - path_regex: hosts/noir/secrets\.yaml$
      key_groups:
          - age:
                - *phix001
                - *phix002
                - *noir
    - path_regex: hosts/blizz/secrets\.yaml$
      key_groups:
          - age:
                - *phix001
                - *phix002
                - *blizz
